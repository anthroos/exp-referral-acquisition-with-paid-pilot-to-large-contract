trajectory:
  experience_type: acquisition
  domain: sales
  duration_days: 65
  steps:
    - relative_day: 0
      kind: action
      channel: scheduling_link
      actors:
        - role: counterparty_tech_dm
          seniority: senior
      content: "Books a discovery call via the author's calendar booking link. Inbound, no prior thread. Counterparty is a sports-vertical broadcast analytics B2B."

    - relative_day: 3
      kind: meeting
      channel: video_call
      actors:
        - role: counterparty_tech_dm
          seniority: senior
        - role: founder
          seniority: exec
      content: "Discovery call held. Counterparty technical decision-maker walks through the data annotation problem; volumes are six-figure aggregate over a multi-quarter horizon."

    - relative_day: 8
      kind: message
      channel: email
      actors:
        - role: founder
          seniority: exec
      content: "Founder asks for an NDA from counterparty so technical iteration can begin."

    - relative_day: 9
      kind: action
      channel: <us_e_signing>
      actors:
        - role: counterparty_legal_signer
          seniority: exec
      tool: Bash
      commands:
        - "<gmail_read_script> 20 'from:<counterparty_tech_email> OR to:<counterparty_tech_email>'"
        - "grep -i '<counterparty_slug>' <crm_dir>/leads.csv 2>/dev/null"
        - "grep -i '<counterparty_slug>' <pm_dir>/pm_tasks_master.csv"
      content: "Counterparty operations/legal lead sends a mutual NDA via the standard US e-signing platform. Author confirms via Gmail read pass + cross-references CRM rows for the deal — the inbox + CRM are the source of truth, no separate notification channel."

    - relative_day: 10
      kind: decision
      channel: <us_e_signing>
      actors:
        - role: founder
          seniority: exec
        - role: counterparty_legal_signer
          seniority: exec
      content: "Mutual NDA signed both sides on counterparty's template. Iteration unblocked."

    - relative_day: 11
      kind: action
      channel: cloud_drive
      actors:
        - role: counterparty_tech_dm
          seniority: senior
      content: "Counterparty shares a sample data folder + initial scope document outlining multi-sport coverage and a frame-count target in the low-seven-figure range across multiple verticals."

    - relative_day: 14
      kind: action
      channel: cloud_drive
      actors:
        - role: own_operator
          seniority: senior
      content: "Author's operations lead begins free pilot labeling on the sample data. No invoice — implicit deal: prove quality, then commercial."

    - relative_day: 21
      kind: observation
      channel: email
      actors:
        - role: own_operator
          seniority: senior
        - role: counterparty_tech_dm
          seniority: senior
      tool: Bash
      commands:
        - "<gmail_read_script> 15 'from:<counterparty_tech_email> OR to:<counterparty_tech_email>'"
        - "<gmail_read_script> 10 'in:sent {to:<counterparty_tech_email> OR to:<counterparty_intro_email>}'"
        - "<gmail_read_script> 1 'from:<counterparty_tech_email>' | grep -A 50 'Preview:'"
      content: "Two-week iteration window. Multiple back-and-forth messages clarifying annotation taxonomy, edge cases, and quality bar. Throughput math gets refined inside the team. Author runs Gmail read passes through the period to track counterparty's clarifying questions and own team's responses; no formal channel separation."

    - relative_day: 30
      kind: message
      channel: email
      actors:
        - role: counterparty_tech_dm
          seniority: senior
      content: "Counterparty asks for a cost estimate — explicit signal that pilot deliverables are acceptable and conversation is moving toward commercial."

    - relative_day: 33
      kind: action
      channel: scheduling_link
      actors:
        - role: founder
          seniority: exec
      content: "Pricing call scheduled."

    - relative_day: 35
      kind: meeting
      channel: video_call
      actors:
        - role: founder
          seniority: exec
        - role: own_operator
          seniority: senior
        - role: counterparty_tech_dm
          seniority: senior
      content: "Pricing call held. Rate aligned at <rate:hourly_low>. Aggregate value lands in the <value:100k-1m> range based on throughput math from the pilot."

    - relative_day: 43
      kind: message
      channel: email
      actors:
        - role: founder
          seniority: exec
      content: "Author sends operational follow-up — clarifies billing cadence, payment terms, contract draft timing. Pushes the deal forward without a hard ask."

    - relative_day: 52
      kind: message
      channel: email
      actors:
        - role: counterparty_tech_dm
          seniority: senior
      content: "Counterparty technical DM: 'intend to move forward.' Asks the author to send a contract draft."

    - relative_day: 52
      kind: action
      channel: email
      actors:
        - role: founder
          seniority: exec
      tool: Edit
      files_touched:
        - <home_dir>/welababeldata/docs/contracts/<counterparty_slug>_ServiceAgreement_draft.md
        - <home_dir>/welababeldata/docs/proposals/<counterparty_slug>_ProposalDraft.md
      content: "Author sends draft Service Agreement (own template), counterparty entity name and address fields filled, money/scope sections aligned with pricing call output. Drafting day shows ~29 sub-events (Edit + Write + Bash) — multi-pass adjustment of clauses, currency table, scope schedule, and the cover-email body before send."

    - relative_day: 56
      kind: message
      channel: email
      actors:
        - role: founder
          seniority: exec
      tool: Bash
      commands:
        - "<gmail_send_script> --to <counterparty_intro_email> --cc <counterparty_tech_email>,<own_team_email> --subject 'Re: ...' --body '<short follow-up body>' --dry-run"
        - "<gmail_send_script> --to <counterparty_intro_email> --cc <counterparty_tech_email>,<own_team_email> --subject 'Re: ...' --body '<short follow-up body>'"
        - "grep -E '<counterparty_slug>|<counterparty_principal>' <crm_dir>/activities.csv | tail -10"
      content: "Author follow-up — short message chasing review status without pressure. Author dry-runs the message via the Gmail send script before live-send, then logs an activity row to the CRM activities CSV."

    - relative_day: 56
      kind: message
      channel: email
      actors:
        - role: counterparty_legal_signer
          seniority: exec
      content: "Counterparty legal signer responds same day: 'reviewing with counsel this week.' Sets the rebound timeline."

    - relative_day: 60
      kind: message
      channel: email
      actors:
        - role: counterparty_external_counsel
          seniority: senior
        - role: counterparty_legal_signer
          seniority: exec
      content: "External counsel returns redlines on the Service Agreement. Volume is moderate (multiple insertions + several deletions). Tone is standard counsel-driven adjustments, not a re-negotiation of commercial terms."

    - relative_day: 61
      kind: decision
      channel: email
      actors:
        - role: founder
          seniority: exec
      content: "Author accepts all redlines without a counter — sub-12-hour turnaround. No principle-of-the-thing pushback on items that don't change the commercial substance."

    - relative_day: 61
      kind: action
      channel: <us_e_signing>
      actors:
        - role: counterparty_legal_signer
          seniority: exec
      content: "Counterparty legal signer sends a fresh <us_e_signing> envelope with the revised Service Agreement, ready for both signatures."

    - relative_day: 62
      kind: action
      channel: <us_e_signing>
      actors:
        - role: founder
          seniority: exec
      content: "Author signs from his side, late evening local time."

    - relative_day: 65
      kind: decision
      channel: <us_e_signing>
      actors:
        - role: counterparty_principal
          seniority: exec
      tool: Bash
      commands:
        - "python3 -c 'import pandas as pd; people = pd.read_csv(\"contacts/people.csv\"); leads = pd.read_csv(\"relationships/leads.csv\"); ...'"
        - "grep '<crm_deal_id>' <crm_dir>/relationships/deals.csv"
        - "python3 << 'EOF' \\\\n# add Alex-Kerr-class principal contact row + flip lead.stage to engaged + log signing activity\\\\nimport csv, pandas as pd\\\\nfrom datetime import date\\\\nEOF"
      files_touched:
        - <crm_dir>/contacts/people.csv
        - <crm_dir>/relationships/leads.csv
        - <crm_dir>/activities.csv
      content: "Counterparty principal (CEO) provides the final signature. Service Agreement now fully executed. Deal commercial close is concrete; production work has not started; first invoice not yet issued. Author updates CRM in a single Python pass — adds the principal as a new contact row, flips lead.stage to 'engaged', logs the signing as an activity."

  notes: |
    Counterparty is a sports-vertical broadcast analytics B2B operating in <US_jurisdiction>. The
    sports vertical itself is a relatively small market; specific sport names, exact frame counts,
    and the counterparty's parent legal entity are deliberately abstracted to category tokens to
    satisfy the reverse-identification rule (the literal combination of "sports broadcast analytics"
    + specific frame volumes + named sports + named counsel firm would have <100 plausible matches
    globally).

    Outcome at day +65 is "fully executed contract" — the CRM lead.stage at trajectory close is
    `engaged` (not `won`), because production has not started and no invoices have been issued.
    The terminal step is the counterparty principal's signature; the first kickoff email and the
    awaited William slot proposal happen AFTER day +65 and are deliberately out of pack scope
    (separate "delivery" arc, not yet documented).

    Eight outbound messages from the author side between day +15 and day +28 are summarized into
    one "two-week iteration" observation step rather than enumerated, because the iteration
    content is mostly taxonomy clarifications that don't move the commercial arc. Their absence
    from individual rows is a compression decision, not a source-extraction gap.

    Pricing band tokens (<rate:hourly_low>, <value:100k-1m>) describe magnitude class without
    revealing the literal $5/hr rate or the $125K-$375K aggregate. Reader's Claude can match on
    "low hourly band" against the user's situation regardless of currency or local market rates.

    The redline volume at day +60 is described as "moderate" rather than with literal counts
    (which would identify counsel firm style). This is a deliberate generalization beyond what
    the upstream `prompts/anonymize.md` in the OpenExp engine repo prescribes.

    Custom kind/channel values (`scheduling_link`, `video_call`, `cloud_drive`) extend the v3
    schema enums per the same pattern as the existing Norda pack. The `<us_e_signing>` channel
    token is consistent with Norda's `<e_signing_platform_local>` style.

dependencies:
  runtime:
    cli_tools:
      - name: gh
        install: "brew install gh"
        docs: "https://cli.github.com/"
      - name: python3 (3.10+)
        install: "preinstalled on macOS/Linux"
        docs: "https://www.python.org/"
      - name: pandas (Python lib)
        install: "pip install pandas"
        docs: "https://pandas.pydata.org/"
    external_accounts:
      - "Gmail account with Google API credentials (for the inbox-read and inbox-send helper scripts)"
      - "US Docusign-class e-signing platform account (counterparty's preferred — author signs from any device)"
      - "CRM as CSV files (companies, people, activities, relationships/leads, relationships/deals) or your equivalent system of record for the deal"
      - "Cloud-drive (Google Drive class) for receiving counterparty's sample data folder"
    claude_skills:
      - name: openexp-use
        source: "https://github.com/anthroos/claude-skills/tree/main/skills/core/openexp-use"
        install_cmd: "ln -s ~/claude-skills/skills/core/openexp-use ~/.claude/skills/openexp-use"
    own_tooling:
      - name: gmail-read helper
        purpose: "Python wrapper around Gmail API to read threads by sender/subject filter; appears as <gmail_read_script> in step commands. Reader can substitute any Gmail API client."
      - name: gmail-send helper
        purpose: "Python wrapper around Gmail API for outbound mail with --dry-run flag; appears as <gmail_send_script>. Substitutable."
